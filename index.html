<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>if(/^#(picks-|wall$|scroll$|about$|orbit$)/.test(location.hash))location.replace("wall.html"+location.hash)</script>
<title>Less Made Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* A one-bit desktop for lessmade.com. Same wall.json and picture packs as the Loose Wall.
   Two colours only: ink and paper. Greys are dither patterns. Pictures are dithered in the browser (Atkinson for stills, Bayer for video).
   One disk holds a folder per project; each project folder holds a folder per kind of work. Personal folders are hidden until found.
   Three small programs: the Viewer (swipe through a project), Music (music/tracks.json, made by music.py) and Notes
   (the owner's notes live in the artifact database, collection "notes", and are baked into wall.json "notes" by golive.py; anyone else's stay on their own device).
   The desk itself is two colours; the pictures are in colour unless Special > Colour pictures is switched off. */
:root{--k:#000;--w:#fff;--ui:"Pixelify Sans","Geneva","Verdana",sans-serif;color-scheme:light;
  --half:repeating-conic-gradient(var(--k) 0 25%,var(--w) 0 50%) 0 0/2px 2px;
  --lite:repeating-conic-gradient(var(--w) 0 75%,var(--k) 0 100%) 0 0/2px 2px;
  --bars:repeating-linear-gradient(var(--k) 0 1px,var(--w) 1px 2px);
  --dark:repeating-conic-gradient(var(--k) 0 75%,var(--w) 0 100%) 0 0/2px 2px;
  --bar:26px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--half);color:var(--k);font:500 15px/1.2 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.p1{background:var(--lite)}body.p2{background:var(--w)}body.p3{background:repeating-linear-gradient(45deg,var(--k) 0 1px,var(--w) 1px 4px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default;border-radius:0}
:focus-visible{outline:2px dotted var(--k);outline-offset:2px}
canvas,img{image-rendering:pixelated}
/* menu bar */
.mb{position:fixed;z-index:9000;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));
  background:var(--w);border-bottom:2px solid var(--k);display:flex;align-items:stretch;gap:0;white-space:nowrap}
.mb>button{padding:0 10px;font-weight:500}.mb>button.mk{font-weight:700}
.mb>button[aria-expanded=true]{background:var(--k);color:var(--w)}
.mb .ck{margin-left:auto}
.menu{position:fixed;z-index:9001;top:calc(var(--bar) + env(safe-area-inset-top,0px));min-width:190px;background:var(--w);border:2px solid var(--k);border-top:0;box-shadow:3px 3px 0 var(--k);padding:2px 0;display:none}
.menu.on{display:block}
.menu button,.menu a{display:flex;width:100%;gap:8px;padding:3px 14px 3px 6px;text-align:left;color:var(--k);text-decoration:none;white-space:nowrap}
.menu button::before,.menu a::before{content:"";width:12px;flex:none}.menu button[aria-checked=true]::before{content:"✓"}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--k);color:var(--w);outline:0}
.menu button:disabled{color:transparent;background:var(--half);-webkit-background-clip:text;background-clip:text}
.menu hr{border:0;height:2px;margin:2px 0;background:var(--half)}
/* desktop icons */
.desk{position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top,0px)) 0 0 0}
.ic{display:flex;flex-direction:column;align-items:center;gap:3px;width:118px;padding:2px;text-align:center}
.ic .g{width:48px;height:40px;display:grid;place-items:center}
.ic svg{display:block;width:48px;height:40px;overflow:visible}.ic svg *{vector-effect:non-scaling-stroke;shape-rendering:crispEdges}
.ic .t{max-width:100%;padding:0 4px;background:var(--w);line-height:1.15;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic.sel .g{filter:invert(1)}.ic.sel .t{background:var(--k);color:var(--w)}
.ic[hidden]{display:none}.ic.hid .t{background:var(--lite);font-style:italic}.ic.hid.sel .t{background:var(--k)}
.ic.pic .g{width:64px;height:64px}.ic.pic canvas{display:block;border:1px solid var(--k);background:var(--w);max-width:64px;max-height:64px}
.ic.pic .g i{position:absolute;font-style:normal;background:var(--w);border:1px solid var(--k);padding:0 3px;font-size:11px}
.ic.pic .g{position:relative}
.dk{position:absolute;inset:0}.dk>.ic{position:absolute;right:max(10px,env(safe-area-inset-right,0px))}
.dk>.ic .t{box-shadow:0 0 0 1px var(--w)}
/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--w);border:2px solid var(--k);box-shadow:3px 3px 0 var(--k);min-width:200px;min-height:120px;max-width:100vw}
.tb{flex:none;height:24px;display:flex;align-items:center;gap:6px;padding:0 4px;border-bottom:2px solid var(--k);cursor:grab;touch-action:none}
.win.act .tb{background:var(--bars) 0 5px/100% 14px no-repeat}
.tb .cl{flex:none;width:16px;height:16px;border:2px solid var(--k);background:var(--w);box-shadow:0 0 0 2px var(--w);visibility:hidden}.win.act .tb .cl{visibility:visible}
.tb .cl:active{background:var(--k)}
.tb .tt{margin:0 auto;padding:0 8px;background:var(--w);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb .sp{flex:none;width:16px}
.st{flex:none;display:flex;justify-content:space-between;gap:12px;padding:2px 8px;border-bottom:1px solid var(--k);box-shadow:0 2px 0 var(--w),0 3px 0 var(--k);margin-bottom:3px;white-space:nowrap;overflow:hidden}
.st button{padding:0 6px;font-weight:700}.st button:active{background:var(--k);color:var(--w)}
.bd{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-color:var(--k) var(--w);-webkit-user-select:none}
.bd::-webkit-scrollbar{width:16px;height:16px}.bd::-webkit-scrollbar-track{background:var(--lite);border-left:2px solid var(--k)}
.bd::-webkit-scrollbar-thumb{background:var(--w);border:2px solid var(--k)}.bd::-webkit-scrollbar-corner{background:var(--w)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 4px;padding:14px 8px 18px;justify-items:center;align-items:start}
.list{width:100%;border-collapse:collapse}.list td,.list th{padding:2px 8px;text-align:left;white-space:nowrap;font-weight:500}
.list th{border-bottom:1px solid var(--k);font-weight:700;position:sticky;top:0;background:var(--w)}
.list tr.sel td{background:var(--k);color:var(--w)}.list td.n{width:100%;white-space:normal}.list tr.hid td{font-style:italic}
.gb{position:absolute;right:0;bottom:0;width:16px;height:16px;border-left:2px solid var(--k);border-top:2px solid var(--k);background:var(--w);cursor:nwse-resize;touch-action:none}
.gb::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border:1px solid var(--k);box-shadow:3px 3px 0 -1px var(--w),3px 3px 0 0 var(--k)}
/* viewer: one project, swiped sideways */
.bd.vb{overflow:hidden;display:flex;flex-direction:column}
.tabs{flex:none;display:flex;overflow-x:auto;border-bottom:2px solid var(--k);scrollbar-width:none;white-space:nowrap}.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.sw::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:5px 11px;border-right:2px solid var(--k);font-weight:700}.tabs button[aria-selected=true],.tabs button[aria-pressed=true]{background:var(--k);color:var(--w)}
.st .cnt{flex:none;min-width:9ch}.st .chips{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}
.st .chips button{flex:none;font-weight:500;padding:0 7px}.st .chips button[aria-pressed=true]{background:var(--k);color:var(--w)}
.st button:disabled{visibility:hidden}.st button svg{display:inline-block;vertical-align:-2px}
/* orbit: a black sky drawn on one canvas */
.ob{flex:1;min-height:0;width:100%;display:block;background:var(--k);cursor:crosshair;touch-action:none;image-rendering:auto}
.st .rd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ob.pk{cursor:var(--zin,zoom-in)}.ob.fo{cursor:var(--zout,zoom-out)}.ob.wc{background:var(--k);cursor:grab}.ob.wc.pk{cursor:var(--zin,zoom-in)}.ob.wc.fo{cursor:var(--zout,zoom-out)}
.sw{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab;background:var(--dark);touch-action:pan-x}
.sw.drg{scroll-snap-type:none;cursor:grabbing}
.sw.onpic{cursor:var(--zin,zoom-in)}
.sw.zm{overflow-x:hidden;scroll-snap-type:none;cursor:var(--zout,zoom-out);touch-action:none}
.sl{flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;overflow:hidden}
.sl img,.sl video{display:block;image-rendering:auto;border:1px solid var(--w);background:var(--w);will-change:transform;-webkit-user-drag:none;pointer-events:none;object-fit:contain}
.sl canvas{display:block;border:1px solid var(--w);will-change:transform}
.sl img.al{background:transparent;border-color:transparent}
.sl.end div{background:var(--k);padding:3px 10px}
.sl.end{color:var(--w);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:16px}
.sl.end button,.ctl button{border:2px solid var(--k);padding:5px 16px;border-radius:8px;font-weight:700;box-shadow:2px 2px 0 var(--k);background:var(--w);color:var(--k)}
.sl.end button{box-shadow:0 0 0 2px var(--k),0 0 0 4px var(--w)}
.sl.end.pick{justify-content:safe center;gap:14px;overflow-y:auto;padding:22px 14px}.sl.end .row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px;max-width:680px;margin-bottom:10px}
.sl.end .row button{display:flex;align-items:baseline;gap:10px}.sl.end .row small{font:500 12px/1 var(--ui)}
.vc[hidden],.fs[hidden]{display:none}
.sl.end button:active,.ctl button:active{background:var(--k);color:var(--w);box-shadow:none;transform:translate(2px,2px)}
.vc{flex:none;height:4.6em;overflow:auto;border-top:2px solid var(--k);padding:5px 10px 6px;-webkit-user-select:text;user-select:text}
/* the strip of small pictures along the bottom: the one in front wears a thick frame */
.fs{flex:none;display:flex;align-items:center;gap:6px;--th:72px;height:calc(var(--th) + 20px);padding:0 20px 0 8px;border-top:2px solid var(--k);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:var(--lite)}.fs::-webkit-scrollbar{display:none}
.fs button{flex:none;height:var(--th);position:relative;border:1px solid var(--k);background:var(--w);overflow:hidden}
.fs button img,.fs button canvas{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}.fs button canvas{image-rendering:pixelated}
.fs button i{position:absolute;left:2px;bottom:2px;font-style:normal;font-size:10px;line-height:1;background:var(--w);border:1px solid var(--k);padding:1px 2px}
.fs button[aria-current=true]{border:0;box-shadow:0 0 0 2px var(--w),0 0 0 6px var(--k);height:calc(var(--th) - 6px);margin:0 7px}
@media (max-width:639px){.fs{--th:56px}}
.vc b{font-weight:700;display:block}.vc p{margin:4px 0 0;max-width:60ch}
/* music */
.mu .now{display:flex;justify-content:space-between;gap:10px;padding:6px 8px 4px;white-space:nowrap}.mu .now b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.mu canvas{display:block;width:320px;max-width:100%;height:auto;margin:0 auto;border-top:1px solid var(--k);border-bottom:1px solid var(--k);touch-action:none;cursor:ew-resize}
.mu .now .mn{flex:none;width:22px;height:20px;border:2px solid var(--k);font-size:12px;line-height:1;margin-left:2px}.mu .now .mn:active{background:var(--k);color:var(--w)}.mu .now b{flex:1;min-width:0}
.mu.mini canvas,.mu.mini .vol,.mu.mini .tl,.mu.mini .eq{display:none}.mu.mini .ctl{padding:6px 8px 8px}
.mu canvas.vz{touch-action:manipulation;cursor:pointer;border-bottom:0;background:var(--k)}
.ctl{display:flex;justify-content:center;gap:10px;padding:10px 8px}.ctl button{min-width:56px;padding:5px 10px}
.tl{list-style:none;margin:0;padding:0;border-top:2px solid var(--k)}
.tl button{display:grid;grid-template-columns:3ch 1fr auto;gap:8px;width:100%;padding:3px 8px;text-align:left}.tl li+li{border-top:1px solid var(--k)}
.tl button[aria-current=true]{background:var(--k);color:var(--w)}
/* faders: volume lies flat, the equaliser's five stand up */
.fd{position:relative;flex:1;height:14px;border:2px solid var(--k);background:var(--lite);touch-action:none;cursor:ew-resize}
.fd i{position:absolute;top:-5px;width:10px;height:20px;background:var(--w);border:2px solid var(--k)}
.fd.v{flex:none;width:14px;height:72px;cursor:ns-resize;background:linear-gradient(var(--k),var(--k)) 0 50%/100% 2px no-repeat,var(--lite)}
.fd.v i{top:auto;left:-6px;width:22px;height:9px}
.vol{display:flex;align-items:center;gap:12px;padding:0 14px 10px;font-size:13px}
.eq{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;padding:12px 14px 8px;border-top:2px solid var(--k);font-size:12px}
.eq .b{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:34px}
.eq button{align-self:center;border:2px solid var(--k);padding:2px 8px;font-weight:700;font-size:13px;background:var(--w)}.eq button:active{background:var(--k);color:var(--w)}
/* notes: a small word processor */
.bd.nb{overflow:hidden;display:flex;flex-direction:column}
.tbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 6px;border-bottom:2px solid var(--k)}.tbar[hidden]{display:none}
.tbar select,.tbar button{height:24px;border:2px solid var(--k);background-color:var(--w);color:var(--k);font:500 14px/1 var(--ui);padding:0 6px;border-radius:0}
.tbar select{appearance:none;-webkit-appearance:none;padding-right:18px;max-width:150px;background-image:linear-gradient(45deg,transparent 50%,var(--k) 50%),linear-gradient(135deg,var(--k) 50%,transparent 50%);background-position:right 9px center,right 5px center;background-size:4px 4px;background-repeat:no-repeat}
.tbar button{min-width:26px;font-weight:700;display:grid;place-items:center}.tbar button[aria-pressed=true],.tbar button:active{background:var(--k);color:var(--w)}
.tbar button svg{display:block;width:14px;height:10px}.tbar .gp{display:flex}.tbar .gp button+button{border-left:0}
.tbar label{display:flex;align-items:center;gap:5px;font-size:13px}
.tbar input[type=range]{appearance:none;-webkit-appearance:none;width:74px;height:12px;background:var(--lite);border:2px solid var(--k);margin:0;border-radius:0}
.tbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;background:var(--w);border:2px solid var(--k);border-radius:0}
.tbar input[type=range]::-moz-range-thumb{width:6px;height:14px;background:var(--w);border:2px solid var(--k);border-radius:0}
.rul{flex:none;height:9px;border-bottom:1px solid var(--k);background:repeating-linear-gradient(90deg,var(--k) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,var(--k) 0 1px,transparent 1px 8px) 0 100%/100% 4px no-repeat}
.pg{flex:1;min-height:0;overflow:auto;padding:12px 16px 20px;outline:0;font:500 16px/1.35 var(--ui);overflow-wrap:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.pg[contenteditable]{cursor:text}.pg[contenteditable]:empty::before{content:attr(data-ph);opacity:.55}
.pg img{max-width:100%;height:auto;vertical-align:bottom}.pg[contenteditable] img{cursor:default}.pg img.on{outline:2px dotted var(--k);outline-offset:2px}
.pg p,.pg div{margin:0}
.nf{flex:none;display:flex;justify-content:space-between;gap:10px;padding:2px 22px 3px 8px;border-top:1px solid var(--k);font-size:13px;white-space:nowrap;overflow:hidden}
.nf button{font-weight:700;padding:0 4px}.nf button.arm{background:var(--k);color:var(--w)}
/* text windows */
.tx{padding:12px 14px 16px;-webkit-user-select:text;user-select:text;max-width:62ch}
.tx h2{margin:0 0 2px;font:700 20px/1.1 var(--ui)}.tx p{margin:0 0 10px}
.tx ol{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--k)}
.tx li{display:grid;grid-template-columns:9ch 1fr;gap:0 10px;padding:4px 0;border-bottom:1px solid var(--k)}.tx li b{font-weight:700}.tx li i{grid-column:2;font-style:normal}
.tx li.gone span::after{content:" (closed)"}
.dlg{text-align:center;padding:18px 20px 20px}.dlg .big{font:700 26px/1 var(--ui);margin-bottom:8px}.dlg p{margin:0 0 4px}
/* loading screens: a boxed card over the desk, in the manner of a program's opening screen */
.spl{position:fixed;inset:0;z-index:9100;display:grid;place-items:center;padding:16px}.spl.boot{background:var(--half);z-index:9300}
.sb{width:min(340px,100%);background:var(--w);border:2px solid var(--k);box-shadow:inset 0 0 0 3px var(--w),inset 0 0 0 4px var(--k),5px 5px 0 var(--k);padding:22px 22px 14px;text-align:center}
.si svg{display:block;width:96px;height:80px;margin:0 auto 10px;overflow:visible}.si svg *{vector-effect:non-scaling-stroke;shape-rendering:crispEdges}
.sn{font:700 26px/1.05 var(--ui)}.sn.big{font-size:40px;letter-spacing:-.01em}.sg{margin:6px 0 16px}
.pb{height:16px;border:2px solid var(--k);background:var(--lite);text-align:left}.pb i{display:block;height:100%;width:0;background:var(--k)}
.sm{margin-top:6px;font-size:13px}.sv{margin-top:14px;padding-top:8px;border-top:1px solid var(--k);font-size:12px}
/* editor: a list on the left, a form on the right */
.edw{flex:1;min-height:0;display:flex}
.edl{flex:none;width:270px;min-height:0;display:flex;flex-direction:column;border-right:2px solid var(--k)}
.edl .top{display:flex;flex-direction:column;gap:6px;padding:6px;border-bottom:2px solid var(--k)}
.edi{flex:1;min-height:0;overflow:auto}
.edi button{display:block;width:100%;padding:3px 8px;text-align:left;border-bottom:1px solid var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edi button[aria-current=true]{background:var(--k);color:var(--w)}
.edr{flex:1;min-width:0;overflow:auto;padding:10px 12px 16px}
.edr label{display:block;margin:0 0 8px;font-size:13px}
.edw input[type=text],.edw input[type=search],.edw textarea,.edw select{display:block;width:100%;border:2px solid var(--k);border-radius:0;background:var(--w);color:var(--k);font:500 16px/1.25 var(--ui);padding:3px 6px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.edw textarea{height:72px;resize:vertical}
.edr .ck{display:flex;align-items:center;gap:8px;font-size:15px}.edr .ck input{flex:none;width:18px;height:18px;margin:0;border:2px solid var(--k);border-radius:0;background:var(--w);-webkit-appearance:none;appearance:none}.edr .ck input:checked{background:var(--k);box-shadow:inset 0 0 0 3px var(--w)}
.edr .pv{display:block;margin:0 0 10px;border:1px solid var(--k);max-width:100%;max-height:130px;image-rendering:auto}
.edr .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;clear:both}
.edw .bt{border:2px solid var(--k);padding:3px 10px;font-weight:700;background:var(--w);text-align:center}.edw .bt.arm,.edw .bt:active{background:var(--k);color:var(--w)}.edw .bt:disabled{background:var(--lite)}
.eds{flex:none;padding:3px 8px;border-top:2px solid var(--k);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:639px){.edw{flex-direction:column}.edl{width:auto;max-height:40%;border-right:0;border-bottom:2px solid var(--k)}}
/* picture tools */
.tls{flex:1;min-height:160px;position:relative;background:var(--dark);overflow:hidden;touch-action:none}
.tls canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:auto}.tls canvas.o{object-fit:fill;pointer-events:none}
.inf{padding:10px 12px 12px;-webkit-user-select:text;user-select:text}.inf p{margin:0}
.inf .hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.inf .hd canvas{flex:none;border:1px solid var(--k);background:var(--w)}
.inf .hd .g{flex:none;width:48px;height:40px}.inf .hd svg{display:block;width:48px;height:40px}
.inf .hd b{display:block;font:700 17px/1.15 var(--ui)}.inf .hd span{font-size:13px}
.inf dl{margin:0;border-top:2px solid var(--k)}.inf dl div{display:grid;grid-template-columns:8ch 1fr;gap:0 10px;padding:3px 0;border-bottom:1px solid var(--k)}
