<style>
/* An endless wall. One loose masonry block of every picture, repeated in every direction; drag anywhere to wander.
   Pick a project or a kind of work and the block re-forms: matches grow and gather, the rest shrink small and quiet.
   Every tile is held by its own spring, so nothing snaps. The words float over the pictures. */
:root{
  --bg:#E4E5E1; --fg:#151613; --soft:#8B8D86;

  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1B19;--fg:#ECEDE8;--soft:#7D7F78;--bink:#FF6A13;--bsoft:#8E908A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1B19;--fg:#ECEDE8;--soft:#7D7F78;--bink:#FF6A13;--bsoft:#8E908A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.2 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.field{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.field.drag{cursor:grabbing}
.it{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--fg) 8%,transparent);visibility:hidden}
.it img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s;pointer-events:none;-webkit-user-drag:none}
.it img.ok{opacity:1}
.it.al{background:transparent}.sf .pic.al{background:transparent!important;box-shadow:none!important}
.it video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;opacity:0;transition:opacity .4s}.it video.on{opacity:1}.it.out video{filter:grayscale(1)}body.zcol .it video{opacity:0!important}body.px .it video{image-rendering:pixelated}
.bigv{position:absolute;left:0;top:0;display:none;object-fit:cover;pointer-events:none;transform-origin:0 0;background:#000}
.dk video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity .4s}.dk video.on{opacity:1}
.it.out img{filter:grayscale(1)}
/* loading: a ballpoint squiggle writes itself over anything waiting for its sharper version */
.sq{position:absolute;left:50%;top:50%;width:min(64%,130px);height:auto;transform:translate(-50%,-50%);overflow:visible;pointer-events:none;opacity:0;transition:opacity .35s;z-index:2}
.ld>.sq{opacity:1}
.sq path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.sq .h{stroke:#F3F1EA;stroke-width:4.2;opacity:.32}
.sq .i{stroke:#1d2c8f;stroke-width:1.9;opacity:.94}
.sq .g{stroke:#0b1253;stroke-width:.55;opacity:.7}
.sq .b{fill:#14217a;opacity:0}
.ld>.sq path{animation:ink 2.4s cubic-bezier(.5,.08,.35,1) infinite}
.ld>.sq .b{animation:blob 2.4s linear infinite}
@keyframes ink{0%{stroke-dashoffset:1}58%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@keyframes blob{0%{opacity:0}4%{opacity:.95}62%{opacity:.95}72%,100%{opacity:0}}
.sqv{position:fixed;left:50%;top:50%;width:150px;z-index:12;display:none}.sqv.ld{display:block}
@media (prefers-reduced-motion:reduce){.ld>.sq path{animation:none;stroke-dasharray:none}.ld>.sq .b{animation:none}}

/* words over the pictures */
.mark{position:fixed;z-index:8;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));margin:0;text-align:center;color:var(--red);font:500 var(--size)/1.05 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0,"opsz" 96;letter-spacing:-.015em;white-space:nowrap;pointer-events:none;transition:opacity .3s}

.mark .n{position:absolute;margin-top:.35em}
.dock{position:fixed;z-index:11;left:0;right:0;bottom:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;color:var(--red);display:flex;flex-direction:column;gap:clamp(18px,3vh,36px);padding:calc(24px + env(safe-area-inset-top,0px)) 0 calc(64px + env(safe-area-inset-bottom,0px));transform:translateY(104%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.2,1),visibility 0s .45s}

.dock::before{content:"";flex:1 0 0;margin-bottom:calc(-1 * clamp(18px,3vh,36px))}.dock .row button{font-size:var(--dfs,min(21vh,30vw));line-height:.98;letter-spacing:-.035em}

.dock .row{flex-direction:column;align-items:flex-start;overflow:visible;gap:0}

.row{display:flex;flex-wrap:nowrap;justify-content:safe center;gap:0 clamp(18px,2.4vw,40px);align-items:baseline;overflow-x:auto;scrollbar-width:none;padding:0 max(18px,env(safe-area-inset-left,0px));overscroll-behavior-x:contain;flex:0 0 auto}

/* corner words: options (left) and picks (right) */
.corner{position:fixed;z-index:8;top:calc(14px + env(safe-area-inset-top,0px));color:var(--red);font:500 clamp(15px,1.5vw,20px)/1 var(--sans);transition:opacity .3s}
.cgroup{display:flex;align-items:center;gap:14px}.cgroup button{color:inherit;font:inherit}
.corner.pvact{top:calc(44px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-size:clamp(13px,1.2vw,16px)}.corner.pvact button{color:inherit;font:inherit;opacity:.85}.corner.pvact button:hover{opacity:1}.corner.pvact[hidden]{display:none}
.corner.optfab{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;font-size:20px;line-height:1;padding:2px 4px;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),0 0 10px var(--bg)}

.corner.ffab{top:auto;max-width:calc(100vw - 80px);white-space:nowrap;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;font-size:20px;line-height:1;padding:2px 4px;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),0 0 10px var(--bg)}
.corner.l{left:max(14px,env(safe-area-inset-left,0px))}.corner.r{right:max(14px,env(safe-area-inset-right,0px))}
.corner sup{font-size:.7em;margin-left:.15em}
.corner[hidden]{display:none}
body.lb .corner{opacity:0;pointer-events:none}
/* the bar: one 14px strip along the bottom for every control */
.bar{position:fixed;z-index:12;left:0;right:0;bottom:0;height:24px;pointer-events:none;box-sizing:content-box;padding:0 max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;background:linear-gradient(to bottom,transparent 10px,var(--bg) 10px);color:var(--bink);font:500 10px/14px var(--mono);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity .3s}

.bar button,.bar a{pointer-events:auto;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:10px 0 0;line-height:14px;text-decoration:none}
.bar button:hover,.bar a:hover{opacity:.65}
.bar .bl,.bar .br,.bar .fw,.bar .pvact{display:flex;align-items:flex-end;gap:12px}
.bar .bl{min-width:0;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}.bar .bl::-webkit-scrollbar{display:none}
.bar .br{flex:0 0 auto}
.bar .fsel{opacity:.6}.bar .fsel i{font-style:normal;margin-left:.25em}
.bar sup{font-size:inherit;vertical-align:baseline;margin-left:.6em}
.bar [hidden]{display:none}
.bar .cred{color:var(--bsoft);line-height:14px}
body.fopen .bar .fsel,body.fopen .bar #pickbtn,body.fopen .bar .pvact{display:none}
body.lb .bar{opacity:0;pointer-events:none}
/* orbit view */
.orb{position:fixed;inset:0;z-index:5;width:100%;height:100%;background:var(--bg);touch-action:none;cursor:grab}

.orbinfo{position:fixed;z-index:12;left:max(10px,env(safe-area-inset-left,0px));right:10px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;gap:14px;align-items:baseline;color:var(--bink);font:500 10px/14px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;pointer-events:none}
.orbinfo .oc{color:var(--fg)}.orbinfo span:not(.oc){color:var(--bsoft)}.orbinfo button{pointer-events:auto;color:var(--bink);font:inherit;letter-spacing:inherit;text-transform:inherit;padding:6px 0}
body.orbit .orbinfo{display:flex}body.orbit.lb .orbinfo{display:none}
body.orbit #pickbtn,body.orbit .pvact,body.orbit #orbbtn,body.orbit .bar a[href*="#about"]{display:none}
.orbpj{position:fixed;left:0;top:0;z-index:6;display:none;flex-direction:column;align-items:center;transform-origin:0 0;pointer-events:none;font:400 var(--pjs,36px)/1.04 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.015em;white-space:nowrap}
body.orbit .orbpj{display:flex}body.orbit.ofocus .orbpj,body.orbit.lb .orbpj{display:none}
.orbpj button,.orbpj a{pointer-events:auto;font:inherit;letter-spacing:inherit;color:var(--fg);opacity:.4;background:none;border:0;padding:.03em .12em;cursor:pointer;text-decoration:none;transition:opacity .2s}
.orbpj button:hover,.orbpj a:hover{opacity:.75}
.orbpj button[aria-pressed=true]{opacity:1;color:var(--red)}

.orbab{position:fixed;left:0;top:0;z-index:6;display:none;transform-origin:0 0;pointer-events:none;width:max-content;max-width:none;font:400 var(--pjs,36px)/1.04 var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.015em;color:var(--fg);background:color-mix(in srgb,var(--bg) 92%,transparent);padding:.25em .35em .35em;transition:opacity .3s}
body.orbit.oabout .orbab{display:block}body.orbit.ofocus .orbab,body.orbit.lb .orbab,body.orbit.oabout .orbpj{display:none}
body.oabout.asel .orbab{opacity:0}

.orbab li b{font-weight:500;font-variant-numeric:tabular-nums}.orbab li span{text-transform:uppercase;letter-spacing:.04em}.orbab li i{font-style:normal;opacity:.72}
@media (max-aspect-ratio:1/1){.orbab ol{columns:1;width:46ch;font-size:.44em}.orbab h3{font-size:.4em}.orbab .pl{font-size:.62em}}
.orbab li.gone span::after{content:" (closed)";opacity:.6;text-transform:none}
.orbpj button{position:relative}.orbpj button .n{position:absolute;left:100%;top:.1em;vertical-align:0;margin-left:.1em}

.orbpj .vt button{opacity:1;color:var(--bsoft);padding:.6em .2em}.orbpj .vt button[aria-pressed=true]{color:var(--fg)}
.orbpj .vt button[aria-pressed=true]::before{content:"["}.orbpj .vt button[aria-pressed=true]::after{content:"]"}
/* scroll view: an endless stream of sections, native scrolling */
.scv{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--fg);box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px) + var(--size,48px)*1.25 + 28px) 16px calc(90px + env(safe-area-inset-bottom,0px))}
body.vscroll .scv{display:block}body.vscroll .field,body.vscroll .orb,body.vscroll .orbpj,body.vscroll .orbinfo,body.vscroll .orbab{display:none!important}
.ss{max-width:1040px;margin:0 auto 96px}
.sfl{max-width:820px;margin:0 auto 64px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

.sfl button[aria-pressed=true]{color:var(--fg)}.sfl button[aria-pressed=true]::before{content:"["}.sfl button[aria-pressed=true]::after{content:"]"}

.sfl .side{color:var(--fg);font-size:12px;letter-spacing:.04em}.sfl .side[aria-pressed=true]{color:var(--bink)}

/* desktop: filters become a left rail that stays put while the stream scrolls */
@media (min-width:900px){.scv{padding-left:236px}
  .sfl{position:fixed;left:max(24px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px) + var(--size,48px)*1.25 + 34px);bottom:56px;width:188px;margin:0;align-items:flex-start;text-align:left;gap:18px;overflow-y:auto;scrollbar-width:none;z-index:6}

.ss .pj{color:var(--bink)}.ss .ct{margin-left:auto;font-variant-numeric:tabular-nums}

.sg{row-gap:56px}

.bar .vsw{display:flex;gap:12px}.bar .vsw button[aria-pressed=true]{color:var(--fg)}.bar .vsw button[aria-pressed=true]::before{content:"["}.bar .vsw button[aria-pressed=true]::after{content:"]"}

/* sheets */
